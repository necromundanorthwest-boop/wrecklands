name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runtime JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Start server and verify health endpoint
        shell: bash
        run: |
          mkdir -p .runtime
          HOST=127.0.0.1 PORT=3000 WRECKLANDS_DB="$PWD/.runtime/ci.sqlite" npm start > /tmp/wrecklands.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/content > /tmp/content.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/wrecklands.log
          exit 1

      - name: Verify Docker build
        run: docker build -t wrecklands-ci .
